<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RHK Feed</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Upload Modal Styles */
    #uploadModal {
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .upload-box {
      background: #121212;
      width: 100%;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #262626;
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <div class="top-nav">
    <div class="rhk-brand-logo">RHK</div>
    <div class="top-icons">
      <!-- Direct Messages Icon -->
      <a href="direct.html" style="color: white;">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.54.36 2.98.97 4.29L1 23l6.71-1.97c1.31.61 2.75.97 4.29.97 5.52 0 10-4.48 10-10S17.52 2 12 2zm4.5 14.5l-2.5-1.5-2.5 1.5.5-2.5-2-1.5 2.5-.5 1-2.5 1 2.5 2.5.5-2 1.5.5 2.5z"/></svg>
      </a>
    </div>
  </div>

  <!-- Stories Tray -->
  <div class="stories-container" id="storiesTray">
    <!-- User's own story prompt -->
    <div class="story-item" onclick="alert('Upload story feature coming soon!')">
      <div class="story-ring" style="background: #333;">
        <div class="story-img" id="myStoryAvatar" style="background-image: url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=300');"></div>
      </div>
      <div class="story-username">Your Story</div>
    </div>
    <!-- Dynamic stories will load here -->
  </div>

  <!-- Main Feed -->
  <main id="feedContainer">
    <p style="text-align: center; color: #888; margin-top: 40px;">Loading feed...</p>
  </main>

  <!-- Upload Modal Overlay -->
  <div class="modal-overlay" id="uploadModal">
    <div class="upload-box">
      <h3 style="margin-bottom: 15px; text-align: center;">New Post</h3>
      <input type="text" id="postImgUrl" class="input-field" placeholder="Image URL (Unsplash, etc.)" required>
      <textarea id="postCaption" class="input-field" placeholder="Write a caption..." style="resize: none; height: 80px;"></textarea>
      <div style="display: flex; gap: 10px;">
        <button class="primary-btn" style="background: #262626;" onclick="closeUploadModal()">Cancel</button>
        <button class="primary-btn" id="submitPostBtn">Share</button>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="home.html"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></a>
    <a href="explore.html"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></a>
    <a href="reels.html"><svg viewBox="0 0 24 24"><path d="M18 3H6c-1.66 0-3 1.34-3 3v12c0 1.66 1.34 3 3 3h12c1.66 0 3-1.34 3-3V6c0-1.66-1.34-3-3-3zm-9 13.5v-9l7 4.5-7 4.5z"/></svg></a>
    <!-- Triggers upload modal -->
    <a href="#" onclick="openUploadModal()"><svg viewBox="0 0 24 24"><path d="M19 11h-6V5h-2v6H5v2h6v6h2v-6h6z"/></svg></a>
    <a href="profile.html"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg></a>
  </nav>

  <script type="module">
    import { auth, db, collection, getDocs, addDoc, onAuthStateChanged, doc, getDoc, orderBy, query } from "./js/firebase-init.js";

    const feedContainer = document.getElementById("feedContainer");
    const uploadModal = document.getElementById("uploadModal");
    const submitPostBtn = document.getElementById("submitPostBtn");
    let currentUserData = null;

    // Check if user clicked the upload button from another page
    if (localStorage.getItem('openUpload') === 'true') {
      localStorage.removeItem('openUpload');
      openUploadModal();
    }

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (userDoc.exists()) {
          currentUserData = userDoc.data();
          document.getElementById("myStoryAvatar").style.backgroundImage = `url('${currentUserData.photoURL}')`;
        }
        loadFeed();
      } else {
        window.location.href = "index.html";
      }
    });

    async function loadFeed() {
      try {
        const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
        const snap = await getDocs(q);
        let html = "";
        
        if(snap.empty) {
          feedContainer.innerHTML = `<p style="text-align: center; color: #888; margin-top: 40px;">No posts yet. Be the first to post!</p>`;
          return;
        }

        snap.forEach((docSnap) => {
          const p = docSnap.data();
          // Only show image posts in the main feed
          if (p.mediaType !== 'reel' && p.mediaType !== 'story_video') {
            html += `
              <article class="post-card">
                <div class="post-header">
                  <a href="view-profile.html?uid=${p.uid}" class="post-user-info">
                    <div class="post-user-avatar" style="background-image: url('${p.userPhoto || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=100'}')"></div>
                    <span class="post-username">${p.username || 'user'}</span>
                  </a>
                </div>
                <div class="post-media-container">
                  <img src="${p.mediaUrl}" alt="Post image" class="post-image" loading="lazy">
                </div>
                <div class="post-actions">
                  <div class="post-actions-left">
                    <svg viewBox="0 0 24 24" onclick="toggleLike(this)"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                  </div>
                </div>
                <div class="post-footer">
                  <div style="font-weight: 600; margin-bottom: 5px;">${p.likesCount || 0} likes</div>
                  <div class="post-caption">
                    <span>${p.username || 'user'}</span> ${p.caption || ''}
                  </div>
                </div>
              </article>
            `;
          }
        });
        feedContainer.innerHTML = html;
      } catch (error) {
        console.error("Error loading feed:", error);
        feedContainer.innerHTML = `<p style="text-align: center; color: red; margin-top: 40px;">Error loading posts.</p>`;
      }
    }

    // Modal Controls
    window.openUploadModal = () => { uploadModal.style.display = "flex"; }
    window.closeUploadModal = () => { 
      uploadModal.style.display = "none"; 
      document.getElementById("postImgUrl").value = "";
      document.getElementById("postCaption").value = "";
    }

    // Handle Posting
    submitPostBtn.onclick = async () => {
      const imgUrl = document.getElementById("postImgUrl").value.trim();
      const caption = document.getElementById("postCaption").value.trim();

      if (!imgUrl || !currentUserData) return;

      submitPostBtn.innerText = "Sharing...";
      submitPostBtn.disabled = true;

      try {
        await addDoc(collection(db, "posts"), {
          uid: currentUserData.uid,
          username: currentUserData.username,
          userPhoto: currentUserData.photoURL,
          mediaUrl: imgUrl,
          mediaType: "image",
          caption: caption,
          likesCount: 0,
          createdAt: new Date().toISOString()
        });
        
        closeUploadModal();
        loadFeed(); // Refresh the feed
      } catch (error) {
        alert("Error posting: " + error.message);
      } finally {
        submitPostBtn.innerText = "Share";
        submitPostBtn.disabled = false;
      }
    };
  </script>
</body>
</html>
