<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RHK Profile</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .profile-header {
      padding: 15px 16px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      border-bottom: 1px solid #262626;
    }
    .profile-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .profile-avatar-large {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      background-color: #333;
    }
    .profile-stats {
      display: flex;
      gap: 25px;
      text-align: center;
    }
    .profile-stats div div:first-child {
      font-weight: 700;
      font-size: 16px;
    }
    .profile-stats div div:last-child {
      font-size: 12px;
      color: #aaa;
    }
    .profile-bio {
      font-size: 14px;
      line-height: 1.4;
    }
    .profile-actions-row {
      display: flex;
      gap: 8px;
    }
    .profile-btn {
      flex: 1;
      padding: 8px;
      background: #262626;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .profile-btn:hover {
      background: #363636;
    }
    .profile-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      padding-bottom: 60px;
    }
  </style>
</head>
<body>

  <div class="top-nav">
    <div class="rhk-brand-logo" id="profileUsernameHeader">RHK</div>
    <div class="top-icons">
      <svg viewBox="0 0 24 24" onclick="logout()"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
    </div>
  </div>

  <div class="profile-header">
    <div class="profile-top-row">
      <div class="profile-avatar-large" id="profileAvatar"></div>
      <div class="profile-stats">
        <div>
          <div id="postsCount">0</div>
          <div>Posts</div>
        </div>
        <div>
          <div id="followersCount">0</div>
          <div>Followers</div>
        </div>
        <div>
          <div id="followingCount">0</div>
          <div>Following</div>
        </div>
      </div>
    </div>
    
    <div>
      <div id="profileFullName" style="font-weight: 600; font-size: 14px;"></div>
      <div class="profile-bio" id="profileBio"></div>
    </div>

    <div class="profile-actions-row">
      <button class="profile-btn" onclick="alert('Edit profile feature coming soon!')">Edit Profile</button>
      <button class="profile-btn" onclick="shareProfile()">Share Profile</button>
    </div>
  </div>

  <div class="profile-grid" id="userPostsGrid"></div>

  <nav class="bottom-nav">
    <a href="home.html"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></a>
    <a href="explore.html"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></a>
    <a href="reels.html"><svg viewBox="0 0 24 24"><path d="M18 3H6c-1.66 0-3 1.34-3 3v12c0 1.66 1.34 3 3 3h12c1.66 0 3-1.34 3-3V6c0-1.66-1.34-3-3-3zm-9 13.5v-9l7 4.5-7 4.5z"/></svg></a>
    <a href="home.html" onclick="localStorage.setItem('openUpload', 'true')"><svg viewBox="0 0 24 24"><path d="M19 11h-6V5h-2v6H5v2h6v6h2v-6h6z"/></svg></a>
    <a href="profile.html"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg></a>
  </nav>

  <script type="module">
    import { auth, db, doc, getDoc, collection, getDocs, query, where, signOut, onAuthStateChanged } from "./js/firebase-init.js";

    const profileUsernameHeader = document.getElementById("profileUsernameHeader");
    const profileAvatar = document.getElementById("profileAvatar");
    const profileFullName = document.getElementById("profileFullName");
    const profileBio = document.getElementById("profileBio");
    const userPostsGrid = document.getElementById("userPostsGrid");
    const postsCount = document.getElementById("postsCount");

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (userDoc.exists()) {
          const data = userDoc.data();
          profileUsernameHeader.innerText = data.username || "RHK Profile";
          profileFullName.innerText = data.fullName || "";
          profileBio.innerText = data.bio || "";
          if (data.photoURL) {
            profileAvatar.style.backgroundImage = `url('${data.photoURL}')`;
          }
        }
        loadUserPosts(user.uid);
      } else {
        window.location.href = "index.html";
      }
    });

    async function loadUserPosts(uid) {
      const q = query(collection(db, "posts"), where("uid", "==", uid));
      const querySnapshot = await getDocs(q);
      let html = "";
      let count = 0;
      querySnapshot.forEach((docSnap) => {
        count++;
        const p = docSnap.data();
        html += `<div class="grid-thumbnail" style="width:100%; aspect-ratio:1/1; background-size:cover; background-position:center; background-image: url('${p.mediaUrl}'); background-color:#1a1a1a;"></div>`;
      });
      userPostsGrid.innerHTML = html || `<p style="grid-column: span 3; text-align: center; color: #888; padding: 40px;">No posts shared yet</p>`;
      postsCount.innerText = count;
    }

    window.logout = async () => {
      await signOut(auth);
      window.location.href = "index.html";
    };

    window.shareProfile = () => {
      navigator.clipboard.writeText(window.location.href);
      alert("Profile link copied to clipboard!");
    };
  </script>
</body>
</html>
