<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RHK Direct Messages</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="top-nav">
    <div style="display: flex; align-items: center; gap: 10px;">
      <a href="home.html" style="color: #fff; text-decoration: none; font-size: 20px;">←</a>
      <div id="chatHeaderName" style="font-weight: 600; font-size: 16px;">Messages</div>
    </div>
  </header>

  <div class="chat-container" id="chatContainer">
    <p style="text-align: center; color: #888; margin-top: 20px;">Select a conversation or start chatting.</p>
  </div>

  <!-- Chat Input Bar -->
  <div style="position: fixed; bottom: 0; left: 0; width: 100%; background: #000; border-top: 1px solid #262626; padding: 10px 15px; display: flex; align-items: center; gap: 10px; z-index: 1000;">
    <input type="text" id="messageInput" class="input-field" placeholder="Message..." style="margin-bottom: 0; border-radius: 20px;">
    <button id="sendBtn" class="primary-btn" style="width: auto; padding: 10px 20px; border-radius: 20px;">Send</button>
  </div>

  <script type="module" src="js/direct.js"></script>
</body>
</html>
